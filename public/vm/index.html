<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Omarchy disposable virtual machine</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
      }

      * {
        box-sizing: border-box;
      }

      #canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #000;
        image-rendering: auto;
        object-fit: contain;
        outline: 0;
        touch-action: none;
      }

      #canvas:focus-visible {
        outline: 2px solid #d9ff43;
        outline-offset: -3px;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        clip-path: inset(50%);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <canvas
      id="canvas"
      width="1600"
      height="900"
      tabindex="0"
      aria-label="Omarchy guest display"
      aria-describedby="guest-input-help"
    >
      Your browser needs canvas support to show the Omarchy guest.
    </canvas>
    <p class="visually-hidden" id="guest-input-help">
      Click the display before using Omarchy keyboard shortcuts. Keyboard and
      pointer input go directly to this disposable virtual machine.
    </p>
    <script type="module" src="/vm/host.mjs"></script>
  </body>
</html>
