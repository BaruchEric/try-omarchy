# Hyprland may use Mesa's software fallback when the virtual GPU exposes only a
# 2D scanout. Architecture-specific profiles decide whether to force it.
WLR_RENDERER_ALLOW_SOFTWARE=1

# Keep Chromium and Qt on Wayland; these mirror Omarchy's normal session.
ELECTRON_OZONE_PLATFORM_HINT=wayland
MOZ_ENABLE_WAYLAND=1
OZONE_PLATFORM=wayland
QT_QPA_PLATFORM=wayland
