<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Omarchy full guest browser gate</title>
    <link rel="stylesheet" href="./full-guest.css">
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">Authentic x86_64 guest · QEMU-Wasm</p>
          <h1>Omarchy full-guest gate</h1>
        </div>
        <div class="status" id="status" role="status" aria-live="polite">Preparing browser checks…</div>
      </header>
      <section class="screen" aria-label="Omarchy virtual machine display">
        <canvas id="desktop" width="1600" height="900" tabindex="0"></canvas>
      </section>
      <div class="facts">
        <span>Phase <strong id="phase">idle</strong></span>
        <span>Frames <strong id="frames">0</strong></span>
        <span>Guest report <strong id="report-state">waiting</strong></span>
        <button id="reset" type="button">Reset VM</button>
      </div>
      <details>
        <summary>Serial and runtime evidence</summary>
        <pre id="serial"></pre>
      </details>
    </main>
    <script type="module" src="./full-guest.mjs"></script>
  </body>
</html>
