<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Omarchy QEMU-Wasm runtime harness</title>
    <link rel="stylesheet" href="./harness.css">
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">Runtime engineering harness</p>
          <h1>Real Omarchy guest pixels</h1>
        </div>
        <button id="start" type="button">Start VM</button>
      </header>
      <section class="display-shell" aria-label="Virtual machine display">
        <canvas id="canvas" tabindex="0" width="1600" height="900"></canvas>
        <div id="status" role="status">Ready to check this browser and load QEMU.</div>
      </section>
      <details>
        <summary>Serial diagnostics</summary>
        <pre id="serial"></pre>
      </details>
    </main>
    <script type="module" src="./harness.mjs"></script>
  </body>
</html>
