<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>Omarchy browser acceptance gate</title>
    <style>
      html,
      body,
      #guest {
        width: 100%;
        height: 100%;
        margin: 0;
        border: 0;
        overflow: hidden;
        background: #000;
      }

      #guest {
        display: block;
      }

      #status {
        position: fixed;
        inset: auto auto 8px 8px;
        z-index: 1;
        max-width: calc(100% - 16px);
        padding: 4px 7px;
        overflow: hidden;
        border: 1px solid rgb(255 255 255 / 22%);
        border-radius: 4px;
        background: rgb(0 0 0 / 72%);
        color: #fff;
        font: 12px/1.25 ui-monospace, monospace;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <iframe id="guest" title="Exact production Omarchy VM host"></iframe>
    <output id="status" aria-live="polite">Initializing acceptance gate…</output>
    <script type="module" src="./harness.mjs"></script>
  </body>
</html>
